[project]
name = "hephaestus-backend"
version = "0.1.0"
description = "Hephaestus backend — the chassis around a Pydantic AI engine."
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pydantic-ai>=2.64.0",
    # Supplies the sandbox file tools (`FileSystem`) and the agent's task list (`Planning`).
    "pydantic-ai-harness[smol]>=0.64.0",
    # Confines the approved host-command escape hatch: seatbelt on macOS, bubblewrap on Linux.
    "sandbox-runtime>=0.2.0",
    "sqlmodel>=0.0.48",
    "cryptography>=50.0.2",
    "argon2-cffi>=25.1.0",
    "alembic>=1.20.1",
    # Imported directly by our own modules rather than relied on transitively.
    "sqlalchemy>=2.1.6",
    "starlette>=1.10.0",
    "lxml>=6.1.3",
    "anyio>=4.15.1",
    "numpy>=2.5.4",
    "openai>=3.42.0",
    "websockets>=17.4",
    "httpx>=0.28.1",
    # Only a CDP client for the containerized Chromium; never install a local browser binary.
    "playwright>=1.64.1",
    # Extracts main content from the rendered HTML string, not as a fetcher.
    "trafilatura>=2.3.1",
    "langdetect>=1.0.9",
    "pypdfium2>=5.14.0",
    "pillow>=13.0.0",
    "croniter>=6.2.4",
    # SKILL.md frontmatter is an interop contract with Claude Code, so it is parsed as real YAML.
    "pyyaml>=6.0.3",
    # Gmail, Graph and JMAP need no client library: they are REST over httpx.
    "aioimaplib>=2.0.3",
    "aiosmtplib>=5.1.3",
    # OAuth must keep no on-disk credential cache: refresh tokens stay vault-sealed.
    "authlib>=1.9.1",
    "email-reply-parser>=0.5.12",
    "icalendar>=7.3.0",
    "python-dateutil>=3.0.0",
    # Shell commands are classified on the real bash grammar, which survives parse errors.
    "tree-sitter>=0.26.0",
    "tree-sitter-bash>=0.25.1",
    "pydantic-monty>=1.3.0",
    "jsonschema>=4.26.0",
    "discord-py>=2.7.1",
    "sqlcipher3>=0.6.4",
    "genai-prices>=0.2.1",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    # openai and pydantic-ai type their HTTP client as httpx2; tests that hand them one import it.
    "httpx2>=2.16.0",
    # `tests/mcp_sample_server.py` imports the SDK directly.
    "mcp>=2.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.6",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
# Autogenerated Alembic revisions — long create_index lines, boilerplate imports.
extend-exclude = ["migrations/versions"]
# Runs inside the guest image, whose Python is Ubuntu 24.04's 3.12.
per-file-target-version = { "vm/*.py" = "py312" }

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF100"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# `-n auto` fans the suite across every core: it is ~2200 mostly-independent tests, each
# on its own throwaway database and temp directory, so there is nothing to serialize on.
# `-n0` puts it back in one process when a run needs `--pdb` or live output.
addopts = "-n auto"
