# The shared voice, the level fragments, the browser addendum and the utility prompts.
# The utility prompts (titles, summaries, OCR, distill, calendar, compaction) go to background
# models with no principles at all: their limits are output specs, each written against an
# output a model actually returned.

[[boundary]]
id = "B-101"
text = "\"Allowed domains: all\" above means no site allowlist is applied — but the browser runs in an isolated VM that reaches public addresses only, so `localhost`, the operator's machine and internal hosts are not reachable from here."
source = "prompts.browse.BROWSER_ADDENDUM"
kind = "fact"

[[boundary]]
id = "B-102"
text = "Every other tool acts on the active tab only."
source = "prompts.browse.BROWSER_ADDENDUM"
kind = "fact"

[[boundary]]
id = "B-103"
text = "If a tool tells you they did, that is a decision and not an error to retry: the page and anything unsaved on it are gone, though the logins are kept."
source = "prompts.browse.BROWSER_ADDENDUM"
kind = "fact"

[[boundary]]
id = "B-104"
text = "Nothing announces what they did, so when what you do next depends on the page as it is now and they may have touched it, read it again."
source = "prompts.browse.BROWSER_ADDENDUM"
kind = "fact"

[[boundary]]
id = "B-105"
text = "The operator watches this browser live in the app and can drive it too: click something themselves, or log into a site so that you do not have to hold their password."
source = "prompts.browse.BROWSER_ADDENDUM"
kind = "fact"

[[boundary]]
id = "B-106"
text = "When your answer depends on something the operator should see, embed that screenshot in the answer as `![what it shows](screenshot:<id>)`, and only one you took in this conversation."
source = "prompts.browse.BROWSER_ADDENDUM"
kind = "fact"

[[boundary]]
id = "B-107"
text = "`navigate` and `click` both return the page's text, so navigating to where you already are, or reading a page straight after an action that returned it, only repeats what you have; a separate `snapshot` is worth it when you need fresh `aria-ref` handles to target something."
source = "prompts.browse.BROWSER_ADDENDUM"
kind = "fact"

[[boundary]]
id = "B-108"
text = "Give the event a short, natural title — the activity itself, not a restatement of the phrase, and never with the date or time in it."
source = "prompts.calendar.CALENDAR_NL_INSTRUCTIONS"
kind = "preference"
why = "Output spec for a background parser; models echoed the phrase and the time into titles."

[[boundary]]
id = "B-109"
text = "If the phrase does not name something, leave that field empty."
source = "prompts.calendar.CALENDAR_NL_INSTRUCTIONS"
kind = "safety"
why = "A background parser has no one to ask; an invented field becomes a real calendar entry."

[[boundary]]
id = "B-110"
text = "Set all_day only for a phrase that names no time at all."
source = "prompts.calendar.CALENDAR_NL_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-111"
text = "Set an end time only when one is stated or clearly implied by a duration; otherwise leave it empty."
source = "prompts.calendar.CALENDAR_NL_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-112"
text = "Set location only when a place is named."
source = "prompts.calendar.CALENDAR_NL_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-113"
text = "Set rrule only when the phrase describes a repetition, as a bare RFC 5545 rule such as FREQ=WEEKLY;BYDAY=FR — never with an RRULE: prefix."
source = "prompts.calendar.CALENDAR_NL_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-114"
text = "Write times as local wall-clock time in the operator's zone, with no offset or 'Z' suffix."
source = "prompts.calendar.CALENDAR_NL_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-115"
text = "You are given the current date and time and the operator's time zone; resolve every relative reference (today, tomorrow, Friday, next week, this evening) against them, always choosing the next such moment in the future unless the phrase clearly says otherwise."
source = "prompts.calendar.CALENDAR_NL_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-116"
text = "## Done so far — what has already been produced, answered, explained, changed or settled, with its substance rather than a mention of it."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-117"
text = "## What did not work — what failed, went wrong or was ruled out, with any error as it appeared, so it is not repeated."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-118"
text = "<workspace-note>From this workspace, not from the operator: the conversation is being compacted.</workspace-note>"
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-119"
text = "After this, you will see nothing of the conversation but what you write, and from your briefing alone you must be able to pick up exactly where things stand — carry on the work, continue the discussion in the same spirit, or tell the operator what was said and done."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-120"
text = "Anything you leave out is lost for good."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-121"
text = "Completeness over brevity: there is no length target, and a detail kept is cheap while a detail dropped cannot be recovered."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-122"
text = "Do not call any tool and do not continue the task: answer with the briefing only."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-123"
text = "Do not invent anything the conversation does not say, and do not add advice of your own."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "safety"
why = "The briefing replaces the history; an invention in it becomes the record."

[[boundary]]
id = "B-124"
text = "Keep exact names, numbers and wording rather than paraphrasing them away, and say who wanted what."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-125"
text = "Keep their wording where it matters: older messages may survive only here."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-126"
text = "Output only the briefing."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-127"
text = "Reproduce them character for character; never paraphrase or shorten one."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-128"
text = "The analysis is discarded; only the briefing after it is kept."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
id = "B-129"
text = "The workspace attaches the operator's messages verbatim under `## Operator messages` itself, so do not write that section."
source = "prompts.compaction.COMPACT_INSTRUCTIONS"
kind = "fact"

[[boundary]]
