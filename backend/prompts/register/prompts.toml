kind = "preference"
principle = "decision"
why = "The operator's planning workflow."

[[boundary]]
id = "B-144"
text = "Write the plan at whatever length the work actually needs: which files, which commands, what would change in each, what you found that the operator would not expect, and how it would be verified."
source = "prompts.levels.PLAN_LEVEL"
kind = "preference"
why = "The operator's plan format."

