# The built-in skills (`backend/skills/`): procedure for one kind of work. A skill keeps what is
# procedure for that work; conduct that holds everywhere lives in the principles.

[[boundary]]
id = "B-301"
text = "- A secret's environment variable holds a placeholder that becomes the real value only in the URL or headers of HTTPS requests to its own host."
source = "skill.build-a-plugin/SKILL.md"
kind = "fact"

[[boundary]]
id = "B-302"
text = "- List only the hosts the code calls under `egress`."
source = "skill.build-a-plugin/SKILL.md"
kind = "safety"
why = "Egress is the plugin's network bound; an extra host widens it for nothing."

[[boundary]]
id = "B-303"
text = "A test reaches only the declared hosts this conversation may also reach."
source = "skill.build-a-plugin/SKILL.md"
kind = "fact"

[[boundary]]
id = "B-304"
text = "For a one-off, run code instead."
source = "skill.build-a-plugin/SKILL.md"
kind = "preference"
principle = "cost"
why = "When a plugin is worth building."

[[boundary]]
id = "B-305"
text = "Never log it, and never send it anywhere else."
source = "skill.build-a-plugin/SKILL.md"
kind = "safety"
why = "A leaked secret can't be taken back."

[[boundary]]
id = "B-306"
text = "Only the operator publishes a plugin, after reading it in the Plugins area."
source = "skill.build-a-plugin/SKILL.md"
kind = "fact"

[[boundary]]
id = "B-307"
text = "They run in the platform VM, in the plugin's own virtualenv, and reach only the hosts the plugin declares."
source = "skill.build-a-plugin/SKILL.md"
kind = "fact"

[[boundary]]
id = "B-308"
text = "Use when a task needs a capability no existing tool provides. ---"
source = "skill.build-a-plugin/SKILL.md"
kind = "fact"

[[boundary]]
