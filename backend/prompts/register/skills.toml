[[boundary]]
id = "B-358"
text = "The reader has just read the body, so a summary tells them nothing: give the key takeaways and new insights, how the understanding has changed, or what it implies from here."
source = "skill.research/references/report-format.md"
kind = "preference"
why = "Report format."

[[boundary]]
id = "B-359"
text = "They are signposts: a reader who skims only the headers should understand the report."
source = "skill.research/references/report-format.md"
kind = "preference"
why = "Report format."

[[boundary]]
id = "B-360"
text = "Use a table or other markdown structure only where it clearly helps, such as a comparison across several options."
source = "skill.research/references/report-format.md"
kind = "preference"
why = "Report format."
