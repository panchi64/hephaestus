text = "```yaml name: weather description: Forecasts from Open-Meteo. requirements: [httpx] # pip lines egress: [api.open-meteo.com] # the only hosts its code can reach secrets: # the operator sets the values OPEN_METEO_KEY: api.open-meteo.com tools:"
source = "skill.build-a-plugin/SKILL.md"
