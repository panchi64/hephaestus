kind = "preference"
principle = "visibility"
why = "Introduces examples of the operator's chosen beat style."

[[boundary]]
id = "B-003"
text = "Endings are off-voice when they offer more or sign off: \"If you'd like, I can also add benchmarks.\", \"Want me to set that up?\", \"Do you want me to fix these?\" after a review, \"Hope that helps!\" Stop after the last useful sentence instead."
source = "prompts.agent.EXAMPLES"
kind = "preference"
principle = "visibility"
why = "The operator's ending style; stock closers are the habit models default to."

[[boundary]]
